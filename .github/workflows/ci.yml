name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compile ReceiptPrint.exe
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $csc = 'C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          if (-not (Test-Path -LiteralPath $csc)) {
            $csc = 'C:\Windows\Microsoft.NET\Framework\v4.0.30319\csc.exe'
          }
          & $csc /nologo /optimize+ /out:ReceiptPrint.exe ReceiptPrint.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: npm test
      - run: npm run build

  dist:
    name: dist (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compile ReceiptPrint.exe
        shell: pwsh
        run: |
          $csc = 'C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          if (-not (Test-Path -LiteralPath $csc)) {
            $csc = 'C:\Windows\Microsoft.NET\Framework\v4.0.30319\csc.exe'
          }
          & $csc /nologo /optimize+ /out:ReceiptPrint.exe ReceiptPrint.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: Saskanuisance-Setup
          path: dist/*.exe
          if-no-files-found: error
